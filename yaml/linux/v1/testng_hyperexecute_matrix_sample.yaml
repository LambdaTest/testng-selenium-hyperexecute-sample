---
version: 0.1
runson: ${matrix.os}

matrix:
  tests: ["Test_1"]
  browser: ["Chrome"]
  version: ["latest"]
  os: ["linux"]

runtime:
  language: java
  version: 11

cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2

pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve

testSuites:
  - mvn test -Dplatname=linux -Dmaven.repo.local=./.m2 -DselectedTests=$tests

parallelism: 1

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, linux, matrix]

mergeArtifacts: true

uploadArtefacts:
 - name: ExecutionSnapshots
   path:
    - target/surefire-reports/html/**

globalPost:
  mode: remote
  commands:
    - "ls"
    - "printenv"
    - "ls .."
    - ls -R hyperexecute | grep ":$" | sed -e 's/:$//' -e 's/[^-][^\/]*\//--/g' -e 's/^/ /' -e 's/-/|/'
    - echo ${ARTIFACTS_DIR}
    - echo ${ARTIFACTS_MANIFEST}
    - echo ${UPLOAD_DIR}
    - ls ${ARTIFACTS_DIR}
    - cat ${ARTIFACTS_MANIFEST}
    - mkdir -p ${UPLOAD_DIR}/uploadedArtifacts
    - touch ${UPLOAD_DIR}/result.json
    - mv ${ARTIFACTS_MANIFEST} ${UPLOAD_DIR}/uploadedArtifacts/
    - shopt -s dotglob && mv ${ARTIFACTS_DIR}/* ${UPLOAD_DIR}
    - ls ${UPLOAD_DIR}
  runson: linux
  downloadArtifacts: true
  email:
    to:
      - ltqa@ltqa.lambdatestautomation.com
    linkValidity: 5
